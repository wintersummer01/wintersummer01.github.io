<!-- The Side Bar -->

<aside aria-label="Sidebar" id="sidebar" class="d-flex flex-column align-items-end">
  <header class="profile-wrapper">
    <a class="site-title d-block" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>
  <!-- .profile-wrapper -->

  <nav class="flex-column flex-grow-1 w-100 ps-0">
    <ul class="nav sidebar-site-nav">
      <li class="nav-item">
        <a href="{{ '/' | relative_url }}" class="nav-link" aria-label="Home">
          <i class="fas fa-house fa-fw"></i>
          <span>HOME</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="{{ '/projects/' | relative_url }}" class="nav-link" aria-label="Projects">
          <i class="fas fa-diagram-project fa-fw"></i>
          <span>PROJECTS</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="{{ '/publications/' | relative_url }}" class="nav-link" aria-label="Publications">
          <i class="fas fa-book-open fa-fw"></i>
          <span>PUBLICATIONS</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="{{ '/#demonstrations' | relative_url }}" class="nav-link" aria-label="Demonstrations">
          <i class="fas fa-display fa-fw"></i>
          <span>DEMONSTRATIONS</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="{{ '/#awards' | relative_url }}" class="nav-link" aria-label="Awards">
          <i class="fas fa-award fa-fw"></i>
          <span>AWARDS</span>
        </a>
      </li>
    </ul>

    <ul class="nav sidebar-social-links" aria-label="External links">
      {% for link in site.data.profile_links %}
        <li class="nav-item">
          <a
            href="{{ link.url }}"
            class="nav-link sidebar-social-button"
            title="{{ link.label }}"
            aria-label="{{ link.label }}"
            {% unless link.noblank %}
              target="_blank"
              rel="noopener noreferrer"
            {% endunless %}
          >
            <i class="fa-fw {{ link.icon }}"></i>
            <span class="visually-hidden">{{ link.label }}</span>
          </a>
        </li>
        <!-- .nav-item -->
      {% endfor %}
    </ul>
  </nav>
</aside>
<!-- #sidebar -->
